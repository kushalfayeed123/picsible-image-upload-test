name: flutter_image_upload
description: A simple image upload app using Riverpod and clean architecture.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  permission_handler: ^12.0.0+1
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.3
  shared_preferences: ^2.5.3

flutter:
  uses-material-design: true
dev_dependencies:
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5
